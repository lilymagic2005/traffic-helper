<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KMB Smart Assistant - 4個按鈕與11B修復版 v2.83</title>
    <style>
        :root {
            --kmb-red: #ff3b30;
            --kmb-red-light: #fff5f5;
            --bg-color: #f7f9fc;
            --card-bg: #ffffff;
            --text-main: #2d3748;
            --text-sub: #718096;
            --border-color: #e2e8f0;
            --blue-time: #0051a8;
            --badge-bg: #edf2f7;
            --radius: 12px;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
        }

        .header {
            background: linear-gradient(135deg, #ff3b30, #ff6b6b);
            color: white;
            padding: 8px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
            font-weight: 700;
            box-shadow: 0 2px 8px rgba(255, 59, 48, 0.15);
        }

        .header-status {
            font-size: 11px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(255, 255, 255, 0.2);
            padding: 2px 8px;
            border-radius: 20px;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background-color: #34c759;
        }

        .refresh-btn {
            background: none;
            border: none;
            color: white;
            cursor: pointer;
            font-size: 13px;
        }

        .tabs-container {
            display: flex;
            background: #ffffff;
            margin: 8px 16px 0 16px;
            padding: 2px;
            border-radius: 10px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.03);
            border: 1px solid var(--border-color);
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }

        .tab-btn {
            flex: 1;
            padding: 6px;
            text-align: center;
            background: none;
            border: none;
            font-size: 12px;
            font-weight: 700;
            color: var(--text-sub);
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.2s ease;
        }

        .tab-btn.active {
            background: var(--kmb-red);
            color: white;
            box-shadow: 0 2px 8px rgba(255, 59, 48, 0.25);
        }

        .tab-content {
            display: none;
            padding: 8px 16px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .tab-content.active {
            display: block;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 10px 14px;
            margin-bottom: 10px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.02);
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }

        /* 站點網格：支援第三行 4 個按鈕完美並排 */
        .stop-manage-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            margin-top: 6px;
            margin-bottom: 6px;
            box-sizing: border-box;
            width: 100%;
        }

        @media (max-width: 900px) {
            .stop-manage-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        @media (max-width: 550px) {
            .stop-manage-grid {
                grid-template-columns: 1fr;
            }
        }

        .stop-manage-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 5px 8px;
            background: #fafbfc;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 11px;
            box-sizing: border-box;
            min-width: 0;
            gap: 4px;
        }

        .stop-info-area {
            display: flex;
            flex-direction: column;
            justify-content: center;
            font-weight: 700;
            overflow: hidden;
            flex: 1;
            min-width: 0;
            line-height: 1.2;
        }

        .stop-name-line {
            display: flex;
            align-items: center;
            gap: 2px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .stop-code-line {
            font-size: 9px;
            color: var(--text-sub);
            font-weight: 500;
            margin-top: 1px;
        }

        .role-btn-group {
            display: flex;
            gap: 2px;
            align-items: center;
            flex-shrink: 0;
        }

        /* 按鈕高度不變，文字 9px，寬度進一步縮短 */
        .role-btn {
            padding: 3px 3px;
            border-radius: 4px;
            font-size: 9px;
            font-weight: 700;
            border: 1px solid #cbd5e1;
            background: #f1f3f5;
            color: #64748b;
            cursor: pointer;
            transition: all 0.2s;
            min-width: 24px;
            text-align: center;
        }

        .role-btn.origin.active {
            background: #e6f4ea;
            border-color: #34a853;
            color: #137333;
        }

        .role-btn.dest.active {
            background: #fff0f0;
            border-color: var(--kmb-red);
            color: var(--kmb-red);
        }

        .delete-stop-btn {
            background: none;
            border: none;
            color: #ef4444;
            cursor: pointer;
            font-size: 11px;
            padding: 0 1px;
            font-weight: bold;
        }

        .add-row {
            display: flex;
            gap: 6px;
            margin-top: 6px;
        }

        .add-input {
            flex: 1;
            padding: 5px 8px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 10px;
            background: #fafbfc;
            font-family: monospace;
        }

        .add-btn {
            background: var(--blue-time);
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 6px;
            font-size: 10px;
            font-weight: 700;
            cursor: pointer;
        }

        .add-btn:disabled {
            background: #cbd5e1;
            cursor: not-allowed;
        }

        .action-btns-group {
            display: flex;
            gap: 4px;
            align-items: center;
        }

        .table-view-btn {
            background: #10b981;
            color: white;
            border: none;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 10px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s;
        }
        .table-view-btn:hover {
            background: #059669;
        }

        .fare-table-btn {
            background: #0ea5e9;
            color: white;
            border: none;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 10px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s;
        }
        .fare-table-btn:hover {
            background: #0284c7;
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: white;
            padding: 16px;
            border-radius: 12px;
            width: 90%;
            max-width: 420px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            font-weight: 800;
            font-size: 14px;
        }
        .close-modal-btn {
            background: none;
            border: none;
            font-size: 16px;
            cursor: pointer;
            color: var(--text-sub);
        }

        .search-group {
            display: flex;
            gap: 6px;
            margin-bottom: 8px;
        }

        .search-input {
            flex: 1;
            padding: 8px 12px;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            font-size: 13px;
            outline: none;
            background: #fafbfc;
        }

        .search-btn {
            background: var(--kmb-red);
            color: white;
            border: none;
            padding: 0 14px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
        }

        .side-by-side-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 16px;
        }

        @media (max-width: 768px) {
            .side-by-side-container {
                grid-template-columns: 1fr;
            }
        }

        .route-top-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            padding-bottom: 4px;
            border-bottom: 2px dashed var(--border-color);
        }

        .route-dest-title {
            font-size: 14px;
            font-weight: 700;
            color: var(--text-main);
        }

        .service-type-badge {
            background: var(--badge-bg);
            color: var(--text-main);
            font-size: 10px;
            font-weight: 700;
            padding: 2px 6px;
            border-radius: 5px;
        }

        .service-type-badge.primary {
            background: #e1f5fe;
            color: #007aff;
        }

        .minimal-table-container {
            max-height: 320px;
            overflow-y: auto;
        }

        .minimal-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 11px;
        }

        .minimal-table th {
            text-align: left;
            color: var(--text-sub);
            font-weight: 700;
            padding: 4px;
            font-size: 10px;
            border-bottom: 2px solid var(--border-color);
            background: #fff;
            position: sticky;
            top: 0;
        }

        .minimal-table td {
            padding: 6px 4px;
            border-bottom: 1px solid #f7f9fc;
            color: var(--text-main);
        }

        .seq-col {
            width: 24px;
            color: var(--text-sub);
            font-weight: 700;
            text-align: center;
        }

        .uuid-cell {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 4px;
        }

        .uuid-text {
            font-family: monospace;
            font-size: 10px;
            color: var(--text-sub);
        }

        .copy-btn {
            background: #f1f3f5;
            border: none;
            padding: 2px 5px;
            border-radius: 4px;
            font-size: 9px;
            font-weight: 700;
            color: #495057;
            cursor: pointer;
            transition: all 0.2s;
        }

        .copy-btn:hover {
            background: #007aff;
            color: white;
        }

        .bus-card {
            background: #ffffff;
            border-radius: var(--radius);
            padding: 12px 14px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid var(--border-color);
            border-left: 5px solid var(--kmb-red);
            box-shadow: 0 2px 6px rgba(0,0,0,0.02);
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }

        .route-no-wrapper {
            position: relative;
            display: inline-block;
            margin-right: 12px;
        }

        .route-no {
            font-size: 20px;
            font-weight: 400;
            line-height: 1;
            color: var(--text-main);
        }

        .route-corner-badge {
            position: absolute;
            top: -5px;
            right: -8px;
            background: #e2e8f0;
            color: #475569;
            font-size: 8px;
            font-weight: 700;
            padding: 1px 3px;
            border-radius: 3px;
        }

        .route-header-line {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        .route-direction {
            font-size: 14px;
            font-weight: 400;
            color: var(--text-main);
        }

        .meta-tags {
            display: flex;
            gap: 4px;
            align-items: center;
        }

        /* 動態票價色階 */
        .fare-tag {
            font-size: 9px;
            font-weight: 600;
            padding: 1px 5px;
            border-radius: 4px;
        }
        .fare-yellow-1 { color: #92400e; background: #fef3c7; }
        .fare-yellow-2 { color: #854d0e; background: #fde68a; }
        .fare-orange-1 { color: #9a3412; background: #fed7aa; }
        .fare-orange-2 { color: #7c2d12; background: #fdba74; }

        .crowd-tag {
            color: #059669;
            background: #d1fae5;
            font-size: 9px;
            font-weight: 500;
            padding: 1px 5px;
            border-radius: 4px;
        }

        .crowd-tag.crowded {
            color: #dc2626;
            background: #fee2e2;
        }

        .route-pair-info {
            font-size: 10px;
            color: var(--text-sub);
            margin-top: 2px;
        }

        .time-box {
            text-align: right;
        }

        .time-mins-container {
            display: flex;
            align-items: baseline;
            justify-content: flex-end;
            gap: 3px;
        }

        .time-digit {
            font-size: 20px;
            font-weight: 400;
            color: var(--blue-time);
            line-height: 1;
        }

        .time-unit {
            font-size: 11px;
            font-weight: 400;
            color: #64748b;
        }

        .time-clock {
            font-size: 11px;
            font-weight: 600;
            color: var(--text-sub);
            margin-top: 2px;
        }

        .empty-state {
            text-align: center;
            padding: 30px 20px;
            color: var(--text-sub);
            font-size: 12px;
        }

        .api-log-box {
            background: #1a202c;
            color: #48bb78;
            font-family: monospace;
            font-size: 10px;
            padding: 6px;
            border-radius: 6px;
            max-height: 60px;
            overflow-y: auto;
            margin-top: 4px;
            white-space: pre-wrap;
            word-break: break-all;
        }

        .app-version {
            text-align: center;
            padding: 8px;
            font-size: 10px;
            color: var(--text-sub);
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="header">
        <span>✨ KMB Smart Assistant</span>
        <div class="header-status">
            <span class="status-dot"></span>
            <span>實時連線中</span>
            <button class="refresh-btn" onclick="loadBusData()">🔄</button>
        </div>
    </div>

    <div class="tabs-container">
        <button class="tab-btn active" onclick="switchTab('etaTab', this)">🚌 實時預報</button>
        <button class="tab-btn" onclick="switchTab('routeStopTab', this)">🔍 路線站序查詢</button>
    </div>

    <!-- TAB 1: 實時預報 -->
    <div id="etaTab" class="tab-content active">
        <div class="card" style="padding: 8px 12px;">
            <div style="font-size: 11px; color: var(--text-main); margin-bottom: 4px; font-weight: 700; display:flex; justify-content:flex-end; align-items:center;">
                <div class="action-btns-group">
                    <button class="table-view-btn" onclick="openDefaultStopsModal()">📋 預設站名表</button>
                    <button class="fare-table-btn" onclick="openFareModal()">📊 票價表</button>
                    <span style="font-size:10px; color:#007aff; cursor:pointer;" onclick="loadBusData()">🔄 重新整理</span>
                </div>
            </div>
            
            <!-- 3 Columns 緊湊網格站點清單 -->
            <div class="stop-manage-grid" id="stopManagerList"></div>

            <!-- 自定義新增站點 -->
            <div class="add-row">
                <input type="text" id="newStopInput" class="add-input" placeholder="輸入 16 碼 UUID 新增站點..." oninput="checkInputState()">
                <button id="addStopBtn" class="add-btn" onclick="addCustomStop()" disabled>+ 新增站點</button>
            </div>
        </div>

        <div id="busListContainer">
            <div class="empty-state">正在載入實時數據...</div>
        </div>
    </div>

    <!-- TAB 2: 路線站序查詢 -->
    <div id="routeStopTab" class="tab-content">
        <div class="card">
            <div style="font-size: 12px; font-weight: 800; color: var(--text-main); margin-bottom: 6px;">🚌 輸入路線號碼查詢站序</div>
            <div class="search-group">
                <input type="text" id="routeSearchInput" class="search-input" placeholder="例如: 3D, 101, 1A" onkeydown="if(event.key==='Enter') searchRouteStops()">
                <button class="search-btn" onclick="searchRouteStops()">查詢</button>
            </div>

            <div style="font-size: 10px; font-weight: 700; color: var(--text-sub); margin-top: 4px; display:flex; justify-content:space-between;">
                <span>API 狀態記錄</span>
                <span style="color:#007aff; cursor:pointer;" onclick="clearRouteLogs()">清除</span>
            </div>
            <div class="api-log-box" id="routeApiLogContainer">等待發送請求...</div>
        </div>

        <div id="routeStopResultsContainer">
            <div class="empty-state">請輸入路線號碼開始查詢</div>
        </div>
    </div>

    <!-- Fare Table Modal 彈出視窗 -->
    <div id="fareModal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <span>📊 路線車費表 (Fare Information)</span>
                <button class="close-modal-btn" onclick="closeFareModal()">×</button>
            </div>
            <div style="max-height: 220px; overflow-y: auto;">
                <table class="minimal-table">
                    <thead>
                        <tr>
                            <th>路線</th>
                            <th>方向</th>
                            <th style="text-align: right;">車費</th>
                        </tr>
                    </thead>
                    <tbody id="fareTableBody">
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Default Stops Table Modal 彈出視窗 -->
    <div id="defaultStopsModal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <span>📋 預設站名與 UUID 對照表</span>
                <button class="close-modal-btn" onclick="closeDefaultStopsModal()">×</button>
            </div>
            <div style="max-height: 250px; overflow-y: auto;">
                <table class="minimal-table">
                    <thead>
                        <tr>
                            <th>站名</th>
                            <th>標籤</th>
                            <th style="text-align: right;">UUID / 複製</th>
                        </tr>
                    </thead>
                    <tbody id="defaultStopsTableBody">
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="app-version">
        KMB Cute & Clean UI | v2.83
    </div>

    <script>
        let allStopsCache = null;
        let routeListCache = null;

        let stopCodeMap = {
            "F60097D67F33DC0C": "啟業邨 (KT313)",
            "23AF5995FEBCA8E6": "啟業邨 (KT314)",
            "D9B53E4B3A192940": "啟業邨 (KT316)",
            "3E73B73B12E25DCF": "觀塘道休憩處 (KT330)",
            "4D3C6D74F6AE8C7D": "觀塘道休憩處 (KT331)",
            "DF942A6B97EABDC4": "觀塘道休憩處 (KT332)",
            "DB42B6238F75CF3C": "啟泰苑 (KT679)",
            "31B93EAF018D6956": "啟泰苑 (KT680)",
            "9C884013EBA1D548": "啟業邨 (KT681)",
            "9E54416DFC0C7B68": "啟業邨 (KT682)"
        };

        // 預設站點清單
        let globalStops = [
            { id: "F60097D67F33DC0C", isOrigin: true, isDest: false, isHome: true, isCustom: false },
            { id: "23AF5995FEBCA8E6", isOrigin: true, isDest: false, isHome: true, isCustom: false },
            { id: "D9B53E4B3A192940", isOrigin: false, isDest: false, isHome: false, isCustom: false },
            { id: "3E73B73B12E25DCF", isOrigin: false, isDest: true, isHome: false, isCustom: false },
            { id: "4D3C6D74F6AE8C7D", isOrigin: false, isDest: true, isHome: false, isCustom: false },
            { id: "DF942A6B97EABDC4", isOrigin: false, isDest: true, isHome: false, isCustom: false },
            // 第三行 4 個按鈕並排
            { id: "DB42B6238F75CF3C", isOrigin: false, isDest: true, isHome: false, isCustom: false },
            { id: "31B93EAF018D6956", isOrigin: false, isDest: true, isHome: false, isCustom: false },
            { id: "9C884013EBA1D548", isOrigin: false, isDest: true, isHome: false, isCustom: false },
            { id: "9E54416DFC0C7B68", isOrigin: false, isDest: true, isHome: false, isCustom: false }
        ];

        // 票價表資料庫：依照 Route 排序，同 Route 則 Outbound 在前、Inbound 在後
        const fareDatabase = [
            { route: "1A", dir: "Inbound (I)", fare: "$7.9" },
            { route: "3D", dir: "Outbound (O)", fare: "$5.8" },
            { route: "11B", dir: "Inbound (I)", fare: "$5.8" },
            { route: "11B", dir: "Outbound (O)", fare: "$5.8" },
            { route: "11C", dir: "Outbound (O)", fare: "$6.7" },
            { route: "17", dir: "Inbound (I)", fare: "$6.7" },
            { route: "89C", dir: "Outbound (O)", fare: "$7.4" },
            { route: "89X", dir: "Outbound (O)", fare: "$7.4" },
            { route: "101", dir: "Inbound (I)", fare: "$7.7" },
            { route: "671", dir: "Outbound (O)", fare: "$14.7" }
        ];

        function openFareModal() {
            const tbody = document.getElementById('fareTableBody');
            let html = '';
            fareDatabase.forEach(item => {
                html += `
                    <tr>
                        <td><b>${item.route}</b></td>
                        <td>${item.dir}</td>
                        <td style="text-align: right; color: #d97706; font-weight: 700;">${item.fare}</td>
                    </tr>
                `;
            });
            tbody.innerHTML = html;
            document.getElementById('fareModal').style.display = 'flex';
        }

        function closeFareModal() {
            document.getElementById('fareModal').style.display = 'none';
        }

        async function openDefaultStopsModal() {
            const tbody = document.getElementById('defaultStopsTableBody');
            let html = '';
            for (const stop of globalStops) {
                const name = await getStopDisplayName(stop.id);
                const tag = stop.isHome ? '🏠 Home' : '一般站點';
                html += `
                    <tr>
                        <td><b>${name}</b></td>
                        <td>${tag}</td>
                        <td style="text-align: right;">
                            <div class="uuid-cell">
                                <span class="uuid-text">${stop.id}</span>
                                <button class="copy-btn" onclick="copyToClipboard('${stop.id}', this)">📋</button>
                            </div>
                        </td>
                    </tr>
                `;
            }
            tbody.innerHTML = html;
            document.getElementById('defaultStopsModal').style.display = 'flex';
        }

        function closeDefaultStopsModal() {
            document.getElementById('defaultStopsModal').style.display = 'none';
        }

        function checkInputState() {
            const val = document.getElementById('newStopInput').value.trim();
            document.getElementById('addStopBtn').disabled = (val.length !== 16);
        }

        async function getStopDisplayName(uuid) {
            if (stopCodeMap[uuid]) return stopCodeMap[uuid];
            if (!allStopsCache) {
                const res = await fetchWithFallback(`https://data.etabus.gov.hk/v1/transport/kmb/stop`);
                allStopsCache = {};
                if (res.data && res.data.data) {
                    res.data.data.forEach(s => { allStopsCache[s.stop] = s.name_tc; });
                }
            }
            if (allStopsCache[uuid]) {
                stopCodeMap[uuid] = allStopsCache[uuid];
                return allStopsCache[uuid];
            }
            const single = await fetchWithFallback(`https://data.etabus.gov.hk/v1/transport/kmb/stop/${uuid}`);
            if (single.data && single.data.data && single.data.data.name_tc) {
                stopCodeMap[uuid] = single.data.data.name_tc;
                return single.data.data.name_tc;
            }
            return uuid.substring(0, 8);
        }

        async function renderStopManager() {
            const container = document.getElementById('stopManagerList');
            let html = '';

            for (let i = 0; i < globalStops.length; i++) {
                const stop = globalStops[i];
                let fullName = await getStopDisplayName(stop.id);
                
                let cleanName = fullName;
                let codePart = "";
                const match = fullName.match(/(.*?)\s*\((.*?)\)$/);
                if (match) {
                    cleanName = match[1].trim();
                    codePart = match[2].trim();
                } else {
                    codePart = stop.id.substring(0, 4);
                }

                const homeIcon = stop.isHome ? `<span title="常用住家站" style="margin-left:2px; font-size:11px; flex-shrink:0;">🏠</span>` : '';
                
                let customCodeDisplay = "";
                if (stop.isCustom) {
                    customCodeDisplay = ` (${stop.id.substring(0,4)})`;
                }

                html += `
                    <div class="stop-manage-row">
                        <div class="stop-info-area">
                            <div class="stop-name-line">
                                <span style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${cleanName}</span>
                                ${homeIcon}
                            </div>
                            <div class="stop-code-line">${codePart}${customCodeDisplay}</div>
                        </div>
                        <div class="role-btn-group">
                            <button class="role-btn origin ${stop.isOrigin ? 'active' : ''}" onclick="toggleStopRole(${i}, 'origin')">起點</button>
                            <button class="role-btn dest ${stop.isDest ? 'active' : ''}" onclick="toggleStopRole(${i}, 'dest')">終點</button>
                            ${stop.isCustom ? `<button class="delete-stop-btn" onclick="removeStop(${i})">×</button>` : ''}
                        </div>
                    </div>
                `;
            }
            container.innerHTML = html;
        }

        function toggleStopRole(index, role) {
            if (role === 'origin') {
                globalStops[index].isOrigin = !globalStops[index].isOrigin;
            } else {
                globalStops[index].isDest = !globalStops[index].isDest;
            }
            renderStopManager();
            loadBusData();
        }

        async function addCustomStop() {
            const input = document.getElementById('newStopInput');
            const uuid = input.value.trim();
            if (uuid.length !== 16) {
                alert("請輸入有效的 16 碼 UUID！");
                return;
            }
            globalStops.push({ id: uuid, isOrigin: true, isDest: false, isHome: false, isCustom: true });
            input.value = "";
            checkInputState();
            await renderStopManager();
            loadBusData();
        }

        function removeStop(index) {
            globalStops.splice(index, 1);
            renderStopManager();
            loadBusData();
        }

        function switchTab(tabId, btnElement) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            btnElement.classList.add('active');
        }

        function copyToClipboard(text, btnElement) {
            navigator.clipboard.writeText(text).then(() => {
                const originalText = btnElement.innerText;
                btnElement.innerText = "✅";
                setTimeout(() => {
                    btnElement.innerText = originalText;
                }, 1500);
            });
        }

        function logRouteApiCall(stepName, url, data) {
            const container = document.getElementById('routeApiLogContainer');
            const timeStr = new Date().toLocaleTimeString();
            const logHTML = `[${timeStr}] ${stepName}\nURL: ${url}\nStatus: ${data}\n\n`;
            if (container.innerHTML.includes("等待發送請求")) container.innerHTML = "";
            container.innerHTML += logHTML;
            container.scrollTop = container.scrollHeight;
        }

        function clearRouteLogs() {
            document.getElementById('routeApiLogContainer').innerHTML = `日誌已清除。`;
        }

        async function fetchWithFallback(url) {
            try {
                const res = await fetch(url);
                if (res.ok) {
                    const data = await res.json();
                    return { status: res.status, data };
                }
                return { status: res.status, data: null };
            } catch (e) {}
            try {
                const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`;
                const res = await fetch(proxyUrl);
                if (res.ok) {
                    const data = await res.json();
                    return { status: res.status, data };
                }
                return { status: res.status, data: null };
            } catch (e) {}
            return { status: 500, data: null };
        }

        function getRouteFare(route, dir) {
            const r = String(route).trim().toUpperCase();
            const d = String(dir).trim().toUpperCase();
            if (r === "3D" && (d === "O" || d === "OUTBOUND")) return "$5.8";
            if (r === "1A" && (d === "I" || d === "INBOUND")) return "$7.9";
            if (r === "17" && (d === "I" || d === "INBOUND")) return "$6.7";
            if (r === "101" && (d === "I" || d === "INBOUND")) return "$7.7";
            if (r === "11B") return "$5.8"; // 涵蓋 11B 所有方向
            if (r === "11C" && (d === "O" || d === "OUTBOUND")) return "$6.7";
            if (r === "89C" && (d === "O" || d === "OUTBOUND")) return "$7.4";
            if (r === "89X" && (d === "O" || d === "OUTBOUND")) return "$7.4";
            if (r === "671" && (d === "O" || d === "OUTBOUND")) return "$14.7";
            return null;
        }

        function getFareClass(fareStr) {
            if (!fareStr) return '';
            const amount = parseFloat(fareStr.replace('$', ''));
            if (amount < 6) return 'fare-yellow-1';
            if (amount < 7) return 'fare-yellow-2';
            if (amount < 8) return 'fare-orange-1';
            return 'fare-orange-2';
        }

        async function searchRouteStops() {
            const targetRoute = document.getElementById('routeSearchInput').value.trim().toUpperCase();
            const container = document.getElementById('routeStopResultsContainer');

            if (!targetRoute) {
                alert("請輸入路線號碼！");
                return;
            }

            container.innerHTML = `<div class="empty-state">正在查詢路線 ${targetRoute} ...</div>`;

            try {
                if (!routeListCache) {
                    const routeListUrl = `https://data.etabus.gov.hk/v1/transport/kmb/route/`;
                    const listResult = await fetchWithFallback(routeListUrl);
                    logRouteApiCall("GET Route List", routeListUrl, listResult.status);
                    routeListCache = (listResult.data && listResult.data.data) ? listResult.data.data : [];
                }

                let routeDirections = routeListCache.filter(item => String(item.route).trim().toUpperCase() === targetRoute);

                if (routeDirections.length === 0) {
                    container.innerHTML = `<div class="error-state">找不到路線 "${targetRoute}"</div>`;
                    return;
                }

                if (!allStopsCache) {
                    const stopListUrl = `https://data.etabus.gov.hk/v1/transport/kmb/stop`;
                    const stopResult = await fetchWithFallback(stopListUrl);
                    logRouteApiCall("GET Stop List", stopListUrl, stopResult.status);
                    
                    allStopsCache = {};
                    if (stopResult.data && stopResult.data.data) {
                        stopResult.data.data.forEach(s => {
                            allStopsCache[s.stop] = s.name_tc;
                        });
                    }
                }

                await Promise.all(routeDirections.map(async (dirInfo) => {
                    const boundCode = String(dirInfo.bound).trim().toUpperCase();
                    const directionStr = (boundCode === 'I' || boundCode === 'INBOUND') ? 'inbound' : 'outbound';
                    
                    const routeStopUrl = `https://data.etabus.gov.hk/v1/transport/kmb/route-stop/${targetRoute}/${directionStr}/${dirInfo.service_type}`;
                    const stopResult = await fetchWithFallback(routeStopUrl);
                    
                    logRouteApiCall(`GET Route-Stop (${directionStr})`, routeStopUrl, stopResult.status);

                    dirInfo.stops = (stopResult.data && stopResult.data.data) ? stopResult.data.data : [];
                }));

                const groupedByService = {};
                routeDirections.forEach(dir => {
                    const st = dir.service_type || '1';
                    if (!groupedByService[st]) {
                        groupedByService[st] = { outbound: null, inbound: null };
                    }
                    const boundCode = String(dir.bound).trim().toUpperCase();
                    if (boundCode === 'I' || boundCode === 'INBOUND') {
                        groupedByService[st].inbound = dir;
                    } else {
                        groupedByService[st].outbound = dir;
                    }
                });

                let html = '';
                const sortedServiceTypes = Object.keys(groupedByService).sort((a, b) => (a === '1' ? -1 : b === '1' ? 1 : a.localeCompare(b)));

                sortedServiceTypes.forEach(st => {
                    const pair = groupedByService[st];
                    const isServiceOne = st === '1';

                    html += `
                        <div style="margin-bottom: 6px; font-size: 12px; font-weight: 700; color: var(--text-main); display: flex; align-items: center; gap: 8px;">
                            <span>路線 ${targetRoute}</span>
                            <span class="service-type-badge ${isServiceOne ? 'primary' : ''}">服務類型: ${st}</span>
                        </div>
                        <div class="side-by-side-container">
                    `;

                    html += renderSingleDirectionCard(pair.outbound, "去程 (Outbound)");
                    html += renderSingleDirectionCard(pair.inbound, "回程 (Inbound)");

                    html += `</div>`;
                });

                container.innerHTML = html;

            } catch (err) {
                container.innerHTML = `<div class="error-state">查詢發生錯誤: ${err.message}</div>`;
            }
        }

        function renderSingleDirectionCard(dirInfo, defaultTitle) {
            if (!dirInfo) {
                return `
                    <div class="card" style="display: flex; align-items: center; justify-content: center; color: var(--text-sub); height: 140px;">
                        此服務類型暫無此方向資料
                    </div>
                `;
            }

            const destText = dirInfo.dest_tc || '指定目的地';

            let tableRows = '';
            dirInfo.stops.forEach(s => {
                const stopName = allStopsCache[s.stop] || '未知站點';
                tableRows += `
                    <tr>
                        <td class="seq-col">${s.seq}</td>
                        <td><b>${stopName}</b></td>
                        <td style="text-align: right;">
                            <div class="uuid-cell">
                                <span class="uuid-text">${s.stop}</span>
                                <button class="copy-btn" onclick="copyToClipboard('${s.stop}', this)">📋 複製</button>
                            </div>
                        </td>
                    </tr>
                `;
            });

            return `
                <div class="card" style="margin-bottom: 0;">
                    <div class="route-top-row">
                        <div class="route-dest-title">往 ${destText}</div>
                        <div style="font-size: 10px; color: var(--text-sub); font-weight: 600;">${defaultTitle} (${dirInfo.stops.length}站)</div>
                    </div>
                    
                    <div class="minimal-table-container">
                        <table class="minimal-table">
                            <thead>
                                <tr>
                                    <th class="seq-col">#</th>
                                    <th>站名</th>
                                    <th style="text-align: right;">UUID / 複製</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${tableRows}
                            </tbody>
                        </table>
                    </div>
                </div>
            `;
        }

        // Tab 1: 實時預報
        async function loadBusData() {
            const container = document.getElementById('busListContainer');
            
            const activeOrigins = globalStops.filter(s => s.isOrigin);
            const activeDests = globalStops.filter(s => s.isDest);

            if (activeOrigins.length === 0) {
                container.innerHTML = `<div class="empty-state">請至少在上方將一個站點設為「起點」！</div>`;
                return;
            }

            container.innerHTML = `<div class="empty-state">正在更新實時預報...</div>`;

            try {
                let allEtas = [];
                await Promise.all(activeOrigins.map(async (orig) => {
                    const etaUrl = `https://data.etabus.gov.hk/v1/transport/kmb/stop-eta/${orig.id}`;
                    const etaResult = await fetchWithFallback(etaUrl);
                    const origName = await getStopDisplayName(orig.id);
                    if (etaResult.data && etaResult.data.data) {
                        etaResult.data.data.forEach(bus => {
                            if (bus.eta) {
                                allEtas.push({ ...bus, queriedOriginId: orig.id, queriedOriginName: origName });
                            }
                        });
                    }
                }));

                if (allEtas.length === 0) {
                    container.innerHTML = `<div class="empty-state">現時啟用的起點暫無即時班次。</div>`;
                    return;
                }

                const routeCache = {};
                const validEtas = allEtas.filter(bus => (bus.bound || bus.dir) && bus.route && bus.service_type);
                
                const uniqueRoutes = [...new Set(validEtas.map(bus => {
                    const b = bus.bound || bus.dir;
                    return `${bus.route}-${b}-${bus.service_type}`;
                }))];

                await Promise.all(uniqueRoutes.map(async (key) => {
                    const [route, bound, service_type] = key.split('-');
                    const boundCode = String(bound).trim().toUpperCase();
                    const directionStr = (boundCode === 'I' || boundCode === 'INBOUND') ? 'inbound' : 'outbound';

                    const routeStopUrl = `https://data.etabus.gov.hk/v1/transport/kmb/route-stop/${route}/${directionStr}/${service_type}`;
                    const stopResult = await fetchWithFallback(routeStopUrl);
                    routeCache[key] = (stopResult.data && stopResult.data.data) ? stopResult.data.data : [];
                }));

                let processedEtas = [];
                for (const bus of validEtas) {
                    const b = bus.bound || bus.dir;
                    const cacheKey = `${bus.route}-${b}-${bus.service_type}`;
                    const routeStops = routeCache[cacheKey] || [];

                    const originStopItem = routeStops.find(s => s.stop === bus.queriedOriginId);
                    
                    let matchedDestName = "";
                    let passesActiveDest = false;

                    if (originStopItem) {
                        for (const dest of activeDests) {
                            const destStopItem = routeStops.find(s => s.stop === dest.id);
                            if (destStopItem && originStopItem.seq < destStopItem.seq) {
                                passesActiveDest = true;
                                matchedDestName = await getStopDisplayName(dest.id);
                                break;
                            }
                        }
                        if (activeDests.length === 0 || passesActiveDest) {
                            processedEtas.push({ 
                                ...bus, 
                                dir: b, 
                                matchedOriginName: bus.queriedOriginName, 
                                matchedDestName: matchedDestName || "指定終點" 
                            });
                        }
                    }
                }

                // 排序：確保所有「即將」到站的車次嚴格置頂在最前，之後依時間排序
                processedEtas.sort((a, b) => {
                    const now = new Date();
                    const diffA = new Date(a.eta) - now;
                    const diffB = new Date(b.eta) - now;
                    const isSoonA = diffA <= 0;
                    const isSoonB = diffB <= 0;

                    if (isSoonA && !isSoonB) return -1;
                    if (!isSoonA && isSoonB) return 1;
                    return diffA - diffB;
                });

                if (processedEtas.length === 0) {
                    container.innerHTML = `<div class="empty-state">目前沒有符合啟用起訖站條件的班次。</div>`;
                    return;
                }

                // F12 主控台輸出要求：僅包含 route, etaTimeStr, crowdclass
                const consoleOutputData = processedEtas.map(bus => {
                    let crowdClass = "normal";
                    if (bus.psg_cap === '2') crowdClass = "crowded";
                    else if (bus.psg_cap === '3') crowdClass = "full";

                    return {
                        route: bus.route,
                        etaTimeStr: bus.eta,
                        crowdclass: crowdClass
                    };
                });
                console.log("=== KMB Bus Realtime Data (F12 Response) ===", consoleOutputData);

                let html = '';
                processedEtas.forEach(bus => {
                    const route = bus.route;
                    const dest = bus.dest_tc || "指定方向";
                    const dir = bus.dir || "N/A";
                    const etaTimeStr = bus.eta;
                    const serviceType = String(bus.service_type || '1');
                    
                    const fare = getRouteFare(route, dir);
                    const fareClass = getFareClass(fare);
                    
                    let isSoon = false;
                    let minsNum = 0;
                    let clockTime = "";

                    if (etaTimeStr) {
                        const etaDate = new Date(etaTimeStr);
                        const diffMins = Math.round((etaDate - new Date()) / 60000);
                        if (diffMins <= 0) {
                            isSoon = true;
                        } else {
                            minsNum = diffMins;
                            clockTime = `${String(etaDate.getHours()).padStart(2, '0')}:${String(etaDate.getMinutes()).padStart(2, '0')}`;
                        }
                    }

                    let crowdText = "座位充足";
                    let crowdClass = "";
                    if (bus.psg_cap === '2') {
                        crowdText = "擁擠";
                        crowdClass = "crowded";
                    } else if (bus.psg_cap === '3') {
                        crowdText = "客滿";
                        crowdClass = "crowded";
                    }

                    const pairText = `${bus.matchedOriginName} > ${bus.matchedDestName}`;

                    // 「即將」設為 20px、深藍色、正常字重、絕對不帶分鐘字眼
                    let timeBoxHtml = '';
                    if (isSoon) {
                        timeBoxHtml = `
                            <div class="time-mins-container">
                                <span class="time-digit" style="font-size: 20px; font-weight: 400; color: var(--blue-time);">即將</span>
                            </div>
                        `;
                    } else {
                        timeBoxHtml = `
                            <div class="time-mins-container">
                                <span class="time-digit">${minsNum}</span>
                                <span class="time-unit">分鐘</span>
                            </div>
                            <div class="time-clock">${clockTime}</div>
                        `;
                    }

                    const fareHtml = fare ? `<span class="fare-tag ${fareClass}">💰 ${fare}</span>` : '';
                    const cornerBadge = (serviceType !== '1') ? `<span class="route-corner-badge">${serviceType}</span>` : '';

                    html += `
                        <div class="bus-card">
                            <div style="display: flex; align-items: center;">
                                <div class="route-no-wrapper">
                                    <div class="route-no">${route}</div>
                                    ${cornerBadge}
                                </div>
                                <div>
                                    <div class="route-header-line">
                                        <span class="route-direction">往 ${dest}</span>
                                        <div class="meta-tags">
                                            ${fareHtml}
                                            <span class="crowd-tag ${crowdClass}">${crowdText}</span>
                                        </div>
                                    </div>
                                    <div class="route-pair-info">${pairText}</div>
                                </div>
                            </div>
                            <div class="time-box">
                                ${timeBoxHtml}
                            </div>
                        </div>
                    `;
                });
                container.innerHTML = html;
            } catch (err) {
                container.innerHTML = `<div class="error-state">無法取得實時數據</div>`;
            }
        }

        window.onload = async () => {
            await renderStopManager();

            fetch("https://data.etabus.gov.hk/v1/transport/kmb/route/")
                .then(res => res.json())
                .then(data => { if(data && data.data) routeListCache = data.data; })
                .catch(() => {});

            loadBusData();
            setInterval(loadBusData, 30000);
        };
    </script>
</body>
</html>
